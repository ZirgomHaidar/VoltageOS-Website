<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/voltageico.svg" />
    <meta name="theme-color" content="#151515" />

    <!--
      The build feed lives on raw.githubusercontent.com, and nothing requests it
      until the bundle has downloaded, parsed and mounted. Warming DNS and TLS
      here moves that handshake into the JS download rather than after it, so
      the first OTA request spends its time on the response alone.
    -->
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />

    <!--
      Maintainer avatars. github.com/<login>.png is a redirect, so a card's
      avatar costs two handshakes on two hosts before a byte of image moves.
      Warming both collapses that to the redirect alone.
    -->
    <link rel="preconnect" href="https://github.com" />
    <link rel="preconnect" href="https://avatars.githubusercontent.com" />

    <title>VoltageOS — Open source Android, built for privacy</title>
    <meta
      name="description"
      content="VoltageOS is an open source Android operating system built around privacy, security and control, with a clean experience and regular security updates for supported devices."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VoltageOS" />
    <meta
      property="og:title"
      content="VoltageOS — Open source Android, built for privacy"
    />
    <meta
      property="og:description"
      content="Open source Android built around privacy, security and control. Browse the latest builds for supported devices."
    />
    <!-- ponytail: `summary` until a 1200x630 og:image exists in public/.
         Declaring summary_large_image with no image renders an empty card
         slot, which reads worse than the small card it falls back to. -->
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
